name: Tag skins

# Runs only when you start it (Actions tab > Tag skins > Run workflow), so it never spends API credit on its own.
# To tag new skins automatically each week, uncomment the schedule below.
on:
  workflow_dispatch:
    inputs:
      test_count:
        description: "Test run: tag this many skins right away and print the results (leave blank for a full batch)"
        required: false
      limit:
        description: "Only batch-tag this many untagged skins (blank = all)"
        required: false
      ids:
        description: "Comma-separated skin IDs to (re)tag"
        required: false
      retag:
        description: "Re-tag skins that already have tags"
        type: boolean
        default: false
      upgrade:
        description: "Re-tag skins whose feet were cut off, if a shop render has been saved since"
        type: boolean
        default: false
      image:
        description: "Images to send (best = icon + full-body render when available; icon = icon only)"
        type: choice
        options: [best, icon]
        default: best
  # schedule:
  #   - cron: "41 9 * * 1"

permissions:
  contents: write
  actions: write

concurrency:
  group: tagging

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FORTNITE_API_KEY: ${{ secrets.FORTNITE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_skins.py

      - name: Collect a batch left over from an earlier run
        run: |
          if [ -f data/pending_batch.json ]; then python scripts/tag_skins.py --collect; fi

      - name: Tag
        run: |
          ARGS="--yes --image ${{ inputs.image || 'best' }}"
          [ -n "${{ inputs.test_count }}" ] && ARGS="$ARGS --test ${{ inputs.test_count }}"
          [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          [ -n "${{ inputs.ids }}" ] && ARGS="$ARGS --ids ${{ inputs.ids }}"
          [ "${{ inputs.retag }}" = "true" ] && ARGS="$ARGS --retag"
          [ "${{ inputs.upgrade }}" = "true" ] && ARGS="$ARGS --upgrade"
          python scripts/tag_skins.py $ARGS

      - name: Update suggestions report
        if: always()
        run: python scripts/build_site_data.py

      - name: Commit tags
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update skin tags"
          git pull --rebase && git push

      - name: Redeploy site
        if: success()
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}
