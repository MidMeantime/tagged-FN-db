name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", "scripts/**", "tagging/**", ".github/workflows/deploy.yml"]
  schedule:
    - cron: "17 7 * * *"   # daily: picks up new skins and Google Sheet edits
  workflow_dispatch:

permissions:
  contents: write   # to save newly seen shop renders in data/renders.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_skins.py
        env:
          FORTNITE_API_KEY: ${{ secrets.FORTNITE_API_KEY }}
      - name: Save newly seen shop renders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/renders.json
          git diff --cached --quiet || (git commit -m "Save shop renders" && git pull --rebase && git push)
      - run: python scripts/build_site_data.py
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
